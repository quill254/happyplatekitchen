<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
<rect width="400" height="400" fill="#fff7ed"/>
<rect width="400" height="400" fill="#ffedd5" opacity="0.4"/>

<!-- Stand base -->
<ellipse cx="200" cy="330" rx="120" ry="14" fill="#1c1917" opacity="0.08"/>
<rect x="150" y="315" width="100" height="16" rx="6" fill="#ea580c"/>

<!-- Pop 1 -->
<g transform="translate(120,0)">
<line x1="0" y1="160" x2="0" y2="315" stroke="#d6a86a" stroke-width="5"/>
<circle cx="0" cy="140" r="42" fill="#f97316"/>
<circle cx="-14" cy="-14" r="0" fill="none"/>
<circle cx="-16" cy="126" r="6" fill="#fed7aa"/>
<circle cx="10" cy="112" r="5" fill="#ffedd5"/>
<circle cx="16" cy="150" r="5.5" fill="#fed7aa"/>
<circle cx="-8" cy="158" r="4.5" fill="#ffedd5"/>
<circle cx="8" cy="128" r="4" fill="#fff1e6"/>
</g>

<!-- Pop 2 (center, larger) -->
<g transform="translate(200,-20)">
<line x1="0" y1="180" x2="0" y2="315" stroke="#d6a86a" stroke-width="6"/>
<circle cx="0" cy="150" r="52" fill="#ea580c"/>
<circle cx="-20" cy="130" r="7" fill="#fce7f3"/>
<circle cx="14" cy="118" r="6" fill="#fed7aa"/>
<circle cx="20" cy="158" r="7" fill="#fce7f3"/>
<circle cx="-10" cy="170" r="5.5" fill="#fed7aa"/>
<circle cx="6" cy="142" r="5" fill="#fff1e6"/>
<circle cx="-24" cy="160" r="4" fill="#ffedd5"/>
</g>

<!-- Pop 3 -->
<g transform="translate(280,0)">
<line x1="0" y1="160" x2="0" y2="315" stroke="#d6a86a" stroke-width="5"/>
<circle cx="0" cy="140" r="42" fill="#c2410c"/>
<circle cx="-14" cy="126" r="5.5" fill="#fed7aa"/>
<circle cx="12" cy="114" r="5" fill="#ffedd5"/>
<circle cx="16" cy="150" r="5" fill="#fed7aa"/>
<circle cx="-8" cy="158" r="4" fill="#fff1e6"/>
</g>

<!-- little sprinkles floating -->
<rect x="70" y="70" width="10" height="3" rx="1.5" fill="#16a34a" transform="rotate(30 75 71)"/>
<rect x="320" y="90" width="10" height="3" rx="1.5" fill="#f59e0b" transform="rotate(-20 325 91)"/>
<rect x="60" y="200" width="10" height="3" rx="1.5" fill="#ea580c" transform="rotate(60 65 201)"/>
<rect x="335" y="220" width="10" height="3" rx="1.5" fill="#16a34a" transform="rotate(-45 340 221)"/>

<text x="200" y="375" font-family="Georgia, serif" font-size="16" fill="#a8a29e" text-anchor="middle" font-style="italic">Photo coming soon</text>
</svg>
